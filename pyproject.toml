[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trello-cli"
version = "0.1.0"
description = "Standalone, dependency-light Trello command-line client (shared by trellm and humphrey)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "trello-cli Contributors" }
]
keywords = ["trello", "cli", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The client itself is stdlib-only (urllib + json); PyYAML is the sole runtime
# dependency and is imported lazily — only when an actual YAML config file is
# read, so pure-env usage works even without it installed.
dependencies = [
    "PyYAML>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
trello = "trello_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["trello_cli"]
# Ship the agent workflow docs (the /trello skill) inside the wheel so an
# `pip install`/`uv tool install` lands the workflow, not just the binary.
force-include = { "skills" = "trello_cli/skills" }

[tool.pytest.ini_options]
testpaths = ["tests"]
